# The server-side backstop for .agents/rules/dev-rules.md: the same gate and
# the same unit lane that run locally, enforced for every push and PR.
name: validate

on:
  push:
    branches: [main, next]
    tags: ["agentcraft/v*"]
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test "scripts/test-hooks/**/*.test.mjs"

  # There is one plugin and one tag form, agentcraft/v<version>: the tag has to
  # name the version its plugin.json carries. A stub is never tagged.
  release-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}
