<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{report title, see Framing}}, {{project}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      // The house tokens, by job, for Mermaid (it computes with colours, so it
      // cannot read the CSS variables below). Keep the two sets the same.
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      const t = dark
        ? { page: "#0e0e0f", panel: "#1e1e20", sunk: "#161617", ink: "#f1f1ee", ink2: "#a3a39d", ink3: "#74746f", line: "#e9e9e5", line2: "#47474a", accent: "#ff6b2c", onAccent: "#171716" }
        : { page: "#f5f5f3", panel: "#ffffff", sunk: "#ebebe8", ink: "#171716", ink2: "#5c5c58", ink3: "#8e8e89", line: "#1c1c1b", line2: "#b4b4ae", accent: "#ff5a1f", onAccent: "#171716" };
      const sans = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      const mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      mermaid.initialize({
        startOnLoad: true,
        securityLevel: "loose",
        theme: "base",
        fontFamily: sans,
        fontSize: 13,
        flowchart: { padding: 10, nodeSpacing: 36, rankSpacing: 40 },
        themeVariables: {
          darkMode: dark, background: t.panel, fontFamily: sans, fontSize: "13px",
          textColor: t.ink, titleColor: t.ink, lineColor: t.ink2,
          primaryColor: t.panel, primaryTextColor: t.ink, primaryBorderColor: t.line,
          secondaryColor: t.sunk, secondaryTextColor: t.ink, secondaryBorderColor: t.line2,
          tertiaryColor: t.sunk, tertiaryTextColor: t.ink, tertiaryBorderColor: t.line2,
          mainBkg: t.panel, nodeBorder: t.line, clusterBkg: t.sunk, clusterBorder: t.line2,
          edgeLabelBackground: t.panel,
          noteBkgColor: t.sunk, noteTextColor: t.ink, noteBorderColor: t.line2,
          actorBkg: t.panel, actorBorder: t.line, actorTextColor: t.ink, actorLineColor: t.line2,
          signalColor: t.ink2, signalTextColor: t.ink,
          labelBoxBkgColor: t.sunk, labelBoxBorderColor: t.line2, labelTextColor: t.ink, loopTextColor: t.ink2,
          activationBkgColor: t.sunk, activationBorderColor: t.line2, sequenceNumberColor: t.page,
          errorBkgColor: t.accent, errorTextColor: t.onAccent,
        },
        // The diagram vocabulary, so a diagram never types a colour:
        //   A:::deep    a deep module: the ink face
        //   A:::faded   a module that is now internal
        //   A:::leak    a module that leaks: an accent outline
        //   A ==> B     leakage: the thick arrow is drawn in the accent
        //   A -.- B     a seam: the dashed line
        themeCSS: `
          .node rect, .node polygon, .node circle, .node ellipse, .node path { stroke-width: 1px; }
          .node rect.basic { rx: 6px; ry: 6px; }
          .cluster rect { rx: 8px; ry: 8px; stroke-width: 1px; }
          .flowchart-link { stroke-width: 1px; }
          .marker { fill: context-stroke; stroke: context-stroke; }
          .cluster-label, .edgeLabel { font-family: ${mono}; font-size: 11px; }
          .edgeLabel, .edgeLabel p, .labelBkg { color: ${t.ink2}; fill: ${t.ink2}; background-color: ${t.panel}; }
          .flowchart-link.edge-thickness-thick { stroke: ${t.accent}; stroke-width: 1.5px; }
          .node.leak rect, .node.leak polygon, .node.leak circle, .node.leak path { stroke: ${t.accent}; stroke-width: 1.5px; }
          .node.deep rect, .node.deep polygon, .node.deep circle, .node.deep path { fill: ${t.ink}; stroke: ${t.ink}; }
          .node.deep .nodeLabel, .node.deep .nodeLabel p { color: ${t.page}; fill: ${t.page}; font-weight: 600; }
          .node.faded rect, .node.faded polygon, .node.faded circle, .node.faded path { stroke: ${t.line2}; stroke-dasharray: 3 3; }
          .node.faded .nodeLabel, .node.faded .nodeLabel p { color: ${t.ink3}; fill: ${t.ink3}; }
        `,
      });
    </script>
    <style>
      /* The house style: monochrome, one orange accent that means "look here
         now", hairlines, no shadows or gradients, system fonts, small mono
         capitals for labels. Every colour in the report is one of these
         tokens; they turn with the reader's light or dark setting. */
      :root {
        --page: #f5f5f3;
        --panel: #ffffff;
        --sunk: #ebebe8;
        --deeper: #dededa;
        --ink: #171716;
        --ink-2: #5c5c58;
        --ink-3: #8e8e89; /* meta only, never body text */
        --line: #1c1c1b;
        --line-2: #b4b4ae;
        --rule: #dcdcd7;
        --accent: #ff5a1f;
        --accent-ink: #c2410c;
        --accent-soft: #ffe9df;
        --on-accent: #171716;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0e0e0f;
          --panel: #1e1e20;
          --sunk: #161617;
          --deeper: #111112;
          --ink: #f1f1ee;
          --ink-2: #a3a39d;
          --ink-3: #74746f;
          --line: #e9e9e5;
          --line-2: #47474a;
          --rule: #262628;
          --accent: #ff6b2c;
          --accent-ink: #ff8a57;
          --accent-soft: #3a1c10;
        }
      }

      /* Page and type. Headings are the sans at 600, close to the body size:
         the mono labels, weight and space carry the hierarchy. */
      /* A bare Tailwind border (border, border-t, divide-y) is a hairline in the rule tone. */
      .report *, .report ::before, .report ::after { border-color: var(--rule); }
      body.report { background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
      .report h1 { font-size: 24px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
      .report h2 { font-size: 17px; line-height: 1.35; font-weight: 600; }
      .report h3 { font-size: 15px; line-height: 1.4; font-weight: 600; }
      .report a { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
      .report :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .report code, .report .files { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
      .report .muted { color: var(--ink-2); }

      /* A label: an eyebrow, a field name, a legend entry, a module name in a
         hand-built diagram. (Not ".label": Mermaid uses that name inside its nodes.) */
      .report .mono-label {
        font-family: var(--mono); font-size: 10.5px; font-weight: 500;
        letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-2);
      }

      /* Faces. A card is the outer frame of a candidate; a panel sits inside
         it (each diagram gets one), on the same face, so its hairline is the
         quiet line and not the rule; a well is the sunk face. */
      .report .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 24px; }
      .report .panel { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 16px; }
      .report .well { background: var(--sunk); border-radius: 8px; padding: 12px 16px; }
      /* The top recommendation is the one thing on the page to look at. */
      .report .card--top { background: var(--accent-soft); border: 1.5px solid var(--accent); }
      .report .card--top a { color: var(--ink); } /* accent text on the accent tint is under 4.5:1 */

      /* Chips: recommendation strength reads as ink weight, never as a traffic light. */
      .report .chip {
        display: inline-block; padding: 1px 8px; border: 1px solid var(--line-2); border-radius: 6px;
        font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em;
        text-transform: uppercase; color: var(--ink-2); white-space: nowrap;
      }
      .report .chip--strong { background: var(--ink); border-color: var(--ink); color: var(--page); font-weight: 700; }
      .report .chip--explore { border-color: var(--line); color: var(--ink); }
      .report .chip--speculative { border-style: dashed; }

      /* A warning (the ADR callout): ink on the accent tint. */
      .report .callout { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; color: var(--ink); font-weight: 600; }

      /* The diagram vocabulary, for hand-built divs and inline SVG. Mermaid
         diagrams get the same four from the script above.
           .module  a module: the panel face and a line
           .seam    a seam: dashed
           .leak    leakage: the accent
           .deep    a deep module: the ink face
           .faded   a module that is now internal */
      .report .module { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
      .report .seam { border-style: dashed; stroke-dasharray: 4 4; }
      .report .leak { border-color: var(--accent); color: var(--accent-ink); stroke: var(--accent); }
      .report .deep { background: var(--ink); border: 1px solid var(--ink); border-radius: 6px; color: var(--page); }
      .report .faded { border-color: var(--line-2); border-style: dashed; color: var(--ink-3); }
      .report svg .module { fill: var(--panel); stroke: var(--line); }
      .report svg .deep { fill: var(--ink); stroke: var(--ink); }
      .report svg .faded { fill: none; stroke: var(--line-2); }
      .report svg text { fill: var(--ink); font-family: var(--sans); font-size: 12px; }
      .report svg text.mono-label { fill: var(--ink-2); font-family: var(--mono); font-size: 10.5px; }
      .report svg .deep + text, .report svg text.on-deep { fill: var(--page); }
      .report .mermaid { display: flex; justify-content: center; }

      @media print {
        .report .card, .report .panel { break-inside: avoid; }
      }
    </style>
  </head>
  <body class="report">
    <main class="max-w-5xl mx-auto px-6 py-12 space-y-12">
      <header>{{header, see Header}}</header>
      <section id="candidates" class="space-y-10">{{candidate cards, see Candidate card}}</section>
      <section id="top-recommendation">{{top recommendation, see Top recommendation}}</section>
    </main>
  </body>
</html>
