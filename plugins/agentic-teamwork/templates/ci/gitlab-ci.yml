# This repo's pipeline: on every merge request, and on {{DEFAULT_BRANCH}} after
# a merge. The team-conventions gate is included; everything else here is the
# repo's own.
include:
  - local: .gitlab/ci/team-conventions.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
