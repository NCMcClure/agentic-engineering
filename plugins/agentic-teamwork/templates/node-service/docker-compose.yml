# Local backing services only. The app itself is started by whoever is working
# on it, never by an agent: `npm --prefix server run dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{PROJECT}}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: ghcr.io/amacneil/dbmate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/{{PROJECT}}?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations
    command: up

volumes:
  pgdata:
