<!doctype html>
<!-- Throwaway design prototype, a spec artifact, not product code.
     Self-contained: CDN assets only, no build step, no imports from the repo.
     Copy this file per prototype; link or iframe it from the spec page it
     illustrates, and add one line to prototypes/index.md. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{prototype title}}, {{project}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Design tokens under trial, mirror the spec's design-system page.
         Keep them as CSS custom properties so the spec's token table and the
         prototype can be compared line for line. */
      :root {
        --color-accent: {{accent}};
        --radius: {{radius}};
      }

      /* The frame around the screen (the title, the caption, the footer, the
         stage the screen sits on, the annotation mark) is the spec site's
         house style and follows the reader's light or dark setting. It is not
         the product's look: inside #screen, style with the tokens above. A
         screen that sets its own text colours sets its own background too, so
         it reads on the stage in both settings. */
      :root {
        --frame-page: #f5f5f3;
        --frame-panel: #ffffff;
        --frame-ink: #171716;
        --frame-ink-2: #5c5c58;
        --frame-rule: #dcdcd7;
        --frame-accent: #ff5a1f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --frame-page: #0e0e0f;
          --frame-panel: #1e1e20;
          --frame-ink: #f1f1ee;
          --frame-ink-2: #a3a39d;
          --frame-rule: #262628;
          --frame-accent: #ff6b2c;
        }
      }
      body {
        background: var(--frame-page);
        color: var(--frame-ink);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .frame-header { border-bottom: 1px solid var(--frame-rule); padding-bottom: 16px; }
      .frame-header h1 { font-size: 22px; line-height: 1.3; font-weight: 600; }
      .frame-header p { margin-top: 4px; color: var(--frame-ink-2); }
      .frame-footer {
        border-top: 1px solid var(--frame-rule); padding-top: 16px; color: var(--frame-ink-2);
        font: 500 10.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.09em; text-transform: uppercase;
      }
      #screen {
        background: var(--frame-panel); color: var(--frame-ink);
        border: 1px solid var(--frame-rule); border-radius: 14px; padding: 24px;
      }
      /* Mark open design questions visibly so they can't be mistaken for
         settled decisions. */
      .annotation { outline: 2px dashed var(--frame-accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="max-w-5xl mx-auto px-6 py-10 space-y-8">
      <header class="frame-header">
        <h1>{{screen name}}</h1>
        <p>
          Prototype of {{spec page}} §{{section}}, {{one-line intent}}
        </p>
      </header>

      <section id="screen">
        {{the screen, static markup with fake data inline; mark open design
        questions with class="annotation" and a short caption}}
      </section>

      <footer class="frame-footer">
        Verification surface for: {{behaviours this screen makes observable}}
      </footer>
    </main>
  </body>
</html>
